name: Python application tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    
    - name: Install uv
      uses: astral-sh/setup-uv@v9.0.0
      
    - name: Set up Python
      run: uv python install 3.14.6
      
    - name: Install dependencies
      run: |
        uv sync
        
    - name: Test with pytest
      run: |
        uv run pytest -v
